[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saymaker"
version = "0.1.0"
description = "Generate images and video from Python on SayMaker: Veo 3.1, Kling 3.0, Seedance 2.0, Nano Banana 2, GPT Image 2.5 and more with one API key"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "SayMaker" }]
keywords = ["ai", "image-generation", "video-generation", "text-to-video", "text-to-image", "veo", "kling", "seedance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://saymaker.ai/?utm_source=pypi&utm_medium=package"
"Video models" = "https://saymaker.ai/video?utm_source=pypi&utm_medium=package"
"API keys" = "https://saymaker.ai/settings/apikeys?utm_source=pypi&utm_medium=package"
Source = "https://github.com/hanshs474/saymaker-py"

[tool.setuptools.packages.find]
where = ["src"]
